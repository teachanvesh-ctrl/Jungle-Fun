<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0F4C45">
<title>Jungle Fun</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F3E8;--ink:#17352F;--card:#fff;--line:#E6DCC0;--brand:#0F4C45;--mango:#FFB627;--leaf:#5DB36B;--prog:#A9DEB1;--tabon:#0F4C45;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E2420;--ink:#F3EBD8;--card:#17352F;--line:#2A4A44;--prog:#2F6B4F;--tabon:#FFB627}}
:root[data-theme="dark"]{--bg:#0E2420;--ink:#F3EBD8;--card:#17352F;--line:#2A4A44;--prog:#2F6B4F;--tabon:#FFB627}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:700 16px/1.25 'Baloo 2',system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden}
h2,p{margin:0}
button{cursor:pointer}
button:focus-visible{outline:3px solid var(--mango);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.hd{display:flex;align-items:center;gap:8px;height:50px;padding:0 12px;flex:none;background:var(--brand);color:#FFF8EA}
.app{flex:1;font-size:1.2rem}
.sc{background:rgba(255,255,255,.16);border-radius:20px;padding:3px 12px}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:inherit;font-size:1.15rem}
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:10px 12px;overflow-y:auto}
.mid{justify-content:center;align-items:center;text-align:center}
.prog{position:relative;height:22px;background:var(--card);border-radius:11px;overflow:hidden;flex:none;border:1px solid var(--line)}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--prog);transition:width .4s}
.prog b{position:relative;display:block;text-align:center;font-size:.8rem;line-height:20px}
.stage{flex:1;min-height:110px;background:var(--card);border-radius:20px;padding:8px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow-y:auto;border:1px solid var(--line)}
.bigl{font-size:clamp(2.6rem,9vh,4rem);line-height:1.05}
.pic{font-size:clamp(2.6rem,9vh,4rem);line-height:1.1}
.pic.xl{font-size:clamp(3.2rem,11vh,4.8rem)}
.swatch{width:clamp(64px,12vh,90px);height:clamp(64px,12vh,90px);border-radius:50%;box-shadow:0 0 0 3px var(--line)}
.pics{display:flex;flex-wrap:wrap;justify-content:center;font-size:1.6rem;line-height:1.2}
.em{border:0;background:none;font-size:1.9rem;min-width:44px;min-height:44px;padding:0}
.em.sm{font-size:1.5rem;min-width:38px;min-height:38px}
.em.d{opacity:.3}
.sp{border:0;background:var(--bg);color:var(--ink);border-radius:20px;padding:4px 14px;min-height:40px;font:inherit}
.ch{display:grid;gap:10px;flex:none}.c2,.c4{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}
.tile{border-radius:18px;font:inherit;font-size:clamp(1.9rem,6.5vh,2.8rem);background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 3px 0 var(--line);display:flex;align-items:center;justify-content:center;min-height:clamp(84px,15vh,120px);padding:4px}
.tile.cl{border:2px solid var(--line)}
.c4 .tile{min-height:clamp(60px,10vh,88px)}
.tile small{background:rgba(255,255,255,.93);color:#17352F;border-radius:10px;padding:1px 10px;font-size:1rem}
.tile:active,.big:active,.key:active{transform:translateY(2px)}
.tile.ok{animation:pop .5s;box-shadow:0 0 0 4px var(--leaf)}
.tile.ok:not(.cl){background:var(--leaf);color:#fff;border-color:var(--leaf)}
.x{opacity:.35}.shake{animation:shake .4s}.pulse{animation:pulse .7s infinite}
.bholu{font-size:4.5rem;line-height:1;animation:bob 2.2s ease-in-out infinite}
.bholu.still{animation:none}
.menu{display:flex;flex-direction:column;gap:10px}
.game{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:8px 16px;min-height:64px;font:inherit;font-size:1.3rem;box-shadow:0 3px 0 var(--line);text-align:left}
.game{border-left:8px solid var(--gc,var(--mango))}
.acc{margin-left:auto;font-size:.85rem;text-align:right;line-height:1.1}
.rep{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-top:4px;font-size:.9rem}
.game b{font-size:1.8rem;min-width:60px;text-align:center}
.game:active{transform:translateY(2px)}
.big{border:0;border-radius:22px;min-height:60px;padding:0 36px;font:inherit;font-size:1.4rem;background:var(--mango);color:#17352F;box-shadow:0 4px 0 #D99410}
.srow{background:var(--card);border-radius:16px;padding:8px 10px;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;font:inherit;min-height:42px;padding:0 14px}
.chip.on{background:var(--mango);border-color:var(--mango);color:#17352F}
.note{opacity:.7;font-size:.85rem}
.warn{background:var(--card);border:2px dashed var(--mango);border-radius:14px;padding:8px 10px;font-size:.85rem}
.ghost{border:0;background:none;color:var(--ink);opacity:.6;font:inherit;padding:10px;min-height:44px}
.gq{font-size:2rem;margin:6px 0}
.gv{display:inline-block;min-width:2.2ch;border-bottom:3px solid var(--mango)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px}
.key{height:60px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1.5rem;box-shadow:0 3px 0 var(--line)}
.key.go{background:var(--leaf);border-color:var(--leaf);color:#fff}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 0 5px var(--mango)}}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.pulse{box-shadow:0 0 0 5px var(--mango)}}
.sel{flex:1;min-width:0;min-height:42px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;padding:0 8px}
.vr{display:flex;gap:6px;margin-top:4px;align-items:center}
.gh{margin:8px 2px 0;font-size:1rem;opacity:.75}
/* stickers + voice studio */
.sg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stk{display:flex;align-items:center;justify-content:center;font-size:2rem;min-height:52px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.stk.lk{opacity:.3;font-size:1.3rem}
.vrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 10px}
.vrow .lab{font-size:1.7rem;min-width:44px;text-align:center}
.vrow .nm{flex:1;min-width:80px;font-size:.95rem}
.vsl{display:flex;align-items:center;gap:4px}
.vsl small{font-size:.75rem;opacity:.75;max-width:92px;line-height:1.05}
.chip.rec{background:#E53935;border-color:#E53935;color:#fff}
.chip.has{border-color:var(--leaf)}
.chip.sm{min-height:38px;padding:0 10px}
/* ---------- v6: splash scene, home grid, learn mode, compact settings ---------- */
:root{--sky1:#8FD3FF;--sky2:#E8F8FF;--sun:#FFD54F;--h1:#9CCC65;--h2:#66BB6A;--h3:#43A047}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#0B1D3A;--sky2:#2A4A70;--sun:#FFF3C4;--h1:#2E5E3A;--h2:#23492D;--h3:#183A22}}
:root[data-theme="dark"]{--sky1:#0B1D3A;--sky2:#2A4A70;--sun:#FFF3C4;--h1:#2E5E3A;--h2:#23492D;--h3:#183A22}
.spl{height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:0 16px 14px;overflow:hidden}
.scene{position:relative;width:calc(100% + 32px);flex:1;min-height:230px;max-height:60vh;overflow:hidden;border-radius:0 0 34px 34px;box-shadow:0 6px 0 var(--line)}
.scene .bg{position:absolute;inset:0;width:100%;height:100%}
.scene .e{position:absolute;font-size:var(--s,2.4rem);line-height:1}
.pk{animation:peek 3.2s ease-in-out infinite}
.fly{left:-14%;animation:flyx 10s linear infinite}
.flt{animation:flt 6s ease-in-out infinite}
.hero{position:absolute;left:50%;bottom:-2%;width:44%;max-width:210px;transform:translateX(-50%)}
.hero .bear{display:block;width:100%;height:auto;animation:bob 2.4s ease-in-out infinite}
.bear .arm{transform-origin:150px 150px;animation:wave 1.8s ease-in-out infinite}
.bear .eyes{transform-origin:100px 75px;animation:blink 5s infinite}
.scene .sun{position:absolute;top:4%;right:5%;width:84px;height:84px;animation:spin 30s linear infinite}
.scene .cl{position:absolute;left:0;width:92px;opacity:.9;animation:drift 38s linear infinite}.scene .cl.c2{width:64px;opacity:.7;animation-duration:54s;animation-delay:-22s}
.scene .cl svg{display:block;width:100%;height:auto}
.ttl{margin:8px 0 0;font-size:clamp(2.6rem,12vw,3.6rem);line-height:1}
.ttl span{display:inline-block;animation:hop 3s ease-in-out infinite;text-shadow:0 3px 0 var(--card),0 5px 0 rgba(0,0,0,.12)}
.sub{font-size:1.1rem;opacity:.85}
.big.play{min-width:210px;min-height:68px;font-size:1.7rem;margin-top:4px}
@keyframes peek{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px) rotate(-5deg)}}
@keyframes flyx{from{transform:translateX(0) scaleX(-1)}to{transform:translateX(640px) scaleX(-1)}}
@keyframes flt{0%,100%{transform:translate(0,0)}25%{transform:translate(24px,-14px)}50%{transform:translate(48px,4px)}75%{transform:translate(18px,12px)}}
@keyframes wave{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-16deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-110px)}to{transform:translateX(560px)}}
@keyframes hop{0%,72%,100%{transform:none}80%{transform:translateY(-10px)}88%{transform:translateY(0)}}
/* home */
.hello{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 12px 6px 8px;flex:none}
.hello .bear{width:56px;height:58px;flex:none}
.ht{flex:1;display:flex;flex-direction:column;line-height:1.15;min-width:0}.ht b{font-size:1.25rem}.ht span{font-size:.88rem;opacity:.75}
.fire{background:var(--bg);border-radius:14px;padding:2px 10px;flex:none}
.goal{display:flex;align-items:center;gap:8px;font-size:.88rem;flex:none;padding:0 4px}
.gb{display:block;flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}.gb i{display:block;height:100%;background:var(--leaf);border-radius:4px;transition:width .4s}
.stkc{display:flex;align-items:center;gap:10px;border:0;border-radius:18px;padding:6px 14px;min-height:54px;font:inherit;font-size:1.15rem;color:#17352F;background:linear-gradient(135deg,#FFE082,#FFB627);box-shadow:0 3px 0 #D99410;text-align:left;flex:none}
.stkc span:first-child{font-size:1.7rem}.stkc .acc{margin-left:auto}
.stkc:active,.gc:active,.mode:active{transform:translateY(2px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}
.gc{display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:1px solid var(--line);border-top:6px solid var(--gc);background:var(--card);color:var(--ink);border-radius:18px;padding:8px 10px 9px;font:inherit;text-align:left;box-shadow:0 3px 0 var(--line);min-height:108px}
.gi{font-size:2rem;line-height:1.15}
.gn{font-size:1rem;line-height:1.1;flex:1}
.gc .gb{width:100%;flex:none;height:6px}.gc .gb i{background:var(--gc)}
.gs{font-size:.72rem;opacity:.75}
.shp{width:1.15em;height:1.15em;display:inline-block;vertical-align:middle}.tile .shp{width:1.5em;height:1.5em}
.grid .gc:last-child:nth-child(odd){grid-column:span 2;min-height:96px}
.dot{display:inline-block;width:1em;height:1em;border-radius:50%;box-shadow:0 0 0 2px var(--line);vertical-align:middle}
/* learn or play */
.chz{background:var(--card);border:1px solid var(--line);border-top:8px solid var(--gc);border-radius:22px;padding:12px;text-align:center;flex:none}
.chi{font-size:3.2rem;line-height:1.15}
.pv{display:flex;justify-content:center;gap:12px;font-size:1.8rem;margin-top:8px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:160px;max-height:300px}
.mode{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;border-radius:26px;font:inherit;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.mode span{font-size:3.2rem;line-height:1.1}.mode b{font-size:1.6rem}.mode small{font-size:1.05rem;opacity:.92}
.mode.lrn{background:linear-gradient(160deg,#4FC3F7,#1E88E5)}.mode.pl{background:linear-gradient(160deg,#81C784,#2E7D32)}
.lc{font:inherit;color:inherit;width:100%;cursor:pointer;font-size:1.45rem;gap:6px}
.lc .pic.xl,.lc .bigl{font-size:clamp(4.5rem,19vh,8.5rem)}.lc .pic{font-size:clamp(3rem,10vh,5rem)}.lc .swatch{width:clamp(110px,24vh,190px);height:clamp(110px,24vh,190px)}.lc .note{font-size:1.1rem}
.lnav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:none}
.key.nav{height:66px;font-size:1.8rem}.key[disabled]{opacity:.35}
/* confetti */
.cf{position:fixed;left:50%;top:42%;width:0;height:0;pointer-events:none;z-index:20}
.cf span{position:absolute;left:0;top:0;font-size:1.5rem;animation:cfly 1.3s ease-out forwards}
@keyframes cfly{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)) scale(1);opacity:0}}
/* compact settings */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:none}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 2px;text-align:center;display:flex;flex-direction:column}
.sum b{font-size:.98rem}.sum small{font-size:.66rem;opacity:.7}
.dt{background:var(--card);border:1px solid var(--line);border-radius:16px;flex:none}
.dt summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:8px;min-height:48px}
.dt summary::-webkit-details-marker{display:none}
.dt summary::after{content:'▾';opacity:.55;transition:transform .2s}
.dt[open] summary::after{transform:rotate(180deg)}
.st{flex:1}.sx{font-size:.75rem;opacity:.65}
.db{padding:8px 12px 12px;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line)}
.orow{display:flex;align-items:center;gap:8px;min-height:42px}
.orow>span{font-size:.88rem;flex:1;min-width:0;line-height:1.15}
.orow .sel{flex:0 1 54%;min-height:38px}
.seg{display:inline-flex;flex:none;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:2px;gap:2px}
.seg button{border:0;background:none;color:var(--ink);font:inherit;font-size:.8rem;min-height:34px;min-width:36px;padding:0 8px;border-radius:10px}
.seg button.on{background:var(--mango);color:#17352F}
.tbl{display:grid;grid-template-columns:1fr auto auto;gap:3px 12px;font-size:.85rem}
.th{opacity:.6;font-size:.72rem}
.db .srow{border:0;padding:6px 0 0;background:none}
.db .ghost{text-align:left;padding:8px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- core ---------- */
var ep=0,$=function(s){return document.querySelector(s)},R=function(h){ep++;$('#app').innerHTML=h};
var KEYS=['abc','hin','num','col','shp','ani','bir','flw','nat','thg','frv','veh','hom','fod','clo','sch','bod','fel','act','job','ply','ind'];
/* dn = solved items per section (saved), sc = accuracy report, cfg = parent settings */
var S={v:3,stars:0,tab:'abc',sleep:0,sc:{},dn:{},wk:{},ad:{},bd:{},stk:-1,sk:0,day:'',streak:0,cfg:{cs:0,hi:1,ch:0,snd:1,min:10,rate:1,ve:'',vh:'',rec:1,name:'',goal:20,hide:{}},td:{d:'',n:0}};
KEYS.forEach(function(k){S.cfg[k]=0});
var Q=null,AC=null,mode='splash',used=0,TODAY=ymd(new Date()),GT=null,VO=[],LD={};
try{var d=JSON.parse(localStorage.getItem('jf3'));if(d){S.stars=+d.stars||0;S.tab=d.tab||'abc';S.sleep=d.sleep?1:0;if(d.cfg)Object.assign(S.cfg,d.cfg);
  ['sc','dn','wk','ad','bd','td'].forEach(function(x){if(d[x]&&typeof d[x]=='object')S[x]=d[x]});
  if(typeof d.stk=='number')S.stk=d.stk;if(typeof d.sk=='number')S.sk=d.sk;if(typeof d.day=='string')S.day=d.day;S.streak=+d.streak||0;
  if(d.ud==TODAY)used=+d.used||0;   /* play time already used today */
  if(!d.v&&S.cfg.ch==3)S.cfg.ch=0;   /* older versions: 3 was only the default, so move to Auto once */
}}catch(e){}
function save(){S.used=used;S.ud=TODAY;try{localStorage.setItem('jf3',JSON.stringify(S))}catch(e){}}
function rnd(n){return Math.floor(Math.random()*n)}
/* Fisher–Yates: fair shuffle (sort-with-random is biased) */
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function rp(s,n){return Array(n+1).join(s)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
/* run f after ms, only if the screen hasn't changed since token e */
function later(f,ms,e){if(e==null)e=ep;setTimeout(function(){if(e==ep&&!S.sleep)f()},ms)}
var PR=['Great job!','Well done!','Awesome!','Super!','Yes!'],HP=['शाबाश!','वाह!','बहुत बढ़िया!','कमाल!'];
function pr(k){var a=k=='hin'?HP:PR;return a[rnd(a.length)]}
function lg(k){return k=='hin'?'hi-IN':'en-IN'}
/* a few letters that speech engines read wrongly when given alone */
var SP={'ऋ':'रि','अः':'अह','ज्ञ':'ग्य'};

/* ---------- audio ---------- */
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume()}catch(e){}}
function beep(f,t,w){if(!S.cfg.snd||!AC)return;try{var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type=w||'sine';g.gain.value=.14;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+t)}catch(e){}}
function good(){beep(660,.12);setTimeout(function(){beep(880,.2)},120)}
function bad(){beep(250,.25,'triangle')}

/* ---------- speech ---------- */
var spk=0,sq=0,AU=null,RT=[.78,.9,1.0],PF=null,SF=null;   /* PF/SF = finish callbacks of the running play()/speak() */
function lv(){try{VO=(speechSynthesis.getVoices()||[]).slice()}catch(e){}}
/* voices load late on many phones, so ask again a few times */
if(window.speechSynthesis){lv();try{speechSynthesis.addEventListener('voiceschanged',lv)}catch(e){speechSynthesis.onvoiceschanged=lv}setTimeout(lv,400);setTimeout(lv,1500);setTimeout(lv,4000)}
function vl(v){return (v.lang||'').replace('_','-')}
/* rank voices: natural/neural/Google ones first, robotic (eSpeak etc.) last */
function vs(v,l){var n=(v.name||'').toLowerCase(),s=0;if(vl(v).toLowerCase()==l.toLowerCase())s+=4;if(/neural|natural|premium|enhanced|online|wavenet/.test(n))s+=6;if(/google/.test(n))s+=4;if(/espeak|festival|compact|robot/.test(n))s-=12;if(v.localService)s+=1;return s}
function vf(l){
  var p=l.slice(0,2),pref=S.cfg[p=='hi'?'vh':'ve'],c=[],i;
  for(i=0;i<VO.length;i++)if(vl(VO[i]).slice(0,2)==p)c.push(VO[i]);
  if(!c.length)return null;
  if(pref)for(i=0;i<c.length;i++)if(c[i].name==pref)return c[i];
  c.sort(function(a,b){return vs(b,l)-vs(a,l)});return c[0];

function iid(it){return (it.big||'')+'|'+(it.word||'')+'|'+(it.em||'')}

function pool(k){var d=S.dn[k]||{};return items(k).filter(function(x){return !d[iid(x)]})}
function prog(k){var l=items(k);return [l.length-pool(k).length,l.length]}

/* weak items: level 1-3 per item, saved. Wrong on first try = +1, right on first try = -1 */
function wl(k,it){return ((S.wk[k]||{})[iid(it)])||0}
function wset(k,it,fst){var m=S.wk[k]||(S.wk[k]={}),id=iid(it),v=(m[id]||0)+(fst?-1:1);if(v>3)v=3;if(v>0)m[id]=v;else delete m[id]}
/* auto difficulty: 2 choices to start; 5 right in a row -> more choices; 2 misses -> fewer */
function adj(k,fst){var a=S.ad[k]||(S.ad[k]={l:2,s:0,m:0});if(fst){a.s++;if(a.s>=3)a.m=0;if(a.s>=5&&a.l<4){a.l++;a.s=0}}else{a.s=0;a.m++;if(a.m>=2&&a.l>2){a.l--;a.m=0}}}

/* next item: (1) one answered wrongly ~4 questions ago comes back, (2) otherwise random from the unsolved,
   weak items more likely; never the same item twice in a row */
function draw(k){
  var q=(Q&&Q.rq)||[],i;
  for(i=0;i<q.length;i++)if(Q.n>=q[i].due&&q[i].it!==LD[k]){Q.re=q[i];LD[k]=q[i].it;return q[i].it}
  var p=pool(k);if(!p.length)return null;
  var c=p.length>1?p.filter(function(x){return x!==LD[k]}):p,tot=0,ws=c.map(function(x){var w=1+2*wl(k,x);tot+=w;return w}),r=Math.random()*tot,j=0;
  while(j<c.length-1&&r>=ws[j]){r-=ws[j];j++}

}

function sticker(after){
  var s=STK[S.stk],e,t0=Date.now();S.stk++;save();
  frame(Q.k,'<div class="stage"><div class="bholu">'+s+'</div><h2>New sticker!</h2><p class="note">'+S.stk+' of '+STK.length+' collected</p></div>');
  e=ep;good();burst(24);
  speak([['en-IN','You got a new sticker!']],function(){later(after,Math.max(500,2600-(Date.now()-t0)),e)});
}
function album(){
  mode='album';hush();Q=null;
  var g=STK.map(function(x,i){return i<S.stk?'<span class="stk">'+x+'</span>':'<span class="stk lk">❓</span>'}).join('');
  var b=TABS.filter(function(t){return t[0]!='set'&&S.bd[t[0]]}).map(function(t){var n=S.bd[t[0]];return '<span>'+t[1]+' '+t[2]+'</span><span>'+rp('🏅',Math.min(n,5))+(n>5?' ×'+n:'')+'</span>'}).join('');
  var st=curStreak();
  frame('album','<h2 style="text-align:center">🏆 My stickers</h2><p class="note" style="text-align:center">'+S.stk+' / '+STK.length+' · '+(S.stk>=STK.length?'You got them all! 🎉':'next sticker in '+(10-S.sk)+' ⭐')+(st?' · 🔥 '+st+' day'+(st>1?'s':''):'')+'</p><div class="sg">'+g+'</div>'+(b?'<div class="srow"><div>🏅 Finished rounds</div><div class="rep">'+b+'</div></div>':'')+'<button class="big" onclick="home()">Back</button>');
}

/* ---------- parent gate (in-app keypad; prompt() is blocked in many in-app browsers) ---------- */
function gate(ok,back){var a=12+rnd(18),b=3+rnd(7);GT={a:a,b:b,ans:a+b,v:'',ok:ok,back:back};mode='gate';hush();
  R('<div class="main mid"><div class="bholu still">🔒</div><h2>Parents only</h2><p class="note">Type the answer to continue</p><div class="gq">'+a+' + '+b+' = <span id="gv" class="gv">?</span></div><div class="pad">'+[1,2,3,4,5,6,7,8,9].map(kb).join('')+'<button class="key" onclick="kd(-1)" aria-label="Delete">⌫</button>'+kb(0)+'<button class="key go" onclick="kd(10)" aria-label="Check">✓</button></div><button class="ghost" onclick="GT.back()">Cancel</button></div>')}
function kb(d){return '<button class="key" onclick="kd('+d+')">'+d+'</button>'}
function kd(d){
  var g=GT;if(!g)return;
  if(d==10){
    if(g.v&&+g.v==g.ans){GT=null;g.ok();return}
    var x=$('#gv'),e=ep;bad();x.classList.remove('shake');void x.offsetWidth;x.classList.add('shake');
    setTimeout(function(){if(e==ep)gate(g.ok,g.back)},450);return;
  }
  if(d==-1)g.v=g.v.slice(0,-1);else if(g.v.length<3)g.v+=d;
  $('#gv').textContent=g.v||'?';
}
function openSet(){gate(settings,home)}

/* ---------- parent settings ---------- */
function vsel(p,key,label){
  var c=VO.filter(function(v){return vl(v).slice(0,2)==p}).sort(function(a,b){return vs(b,p+'-IN')-vs(a,p+'-IN')});
  if(!c.length)return '';
  return '<div class="srow"><div>'+label+'</div><div class="vr"><select class="sel" onchange="setv(\''+key+'\',this.value)"><option value="">Auto (best voice)</option>'+c.map(function(v){return '<option value="'+esc(v.name)+'"'+(S.cfg[key]===v.name?' selected':'')+'>'+esc(v.name)+' ('+esc(vl(v))+')</option>'}).join('')+'</select><button class="chip" onclick="testv(\''+p+'\')">▶ Test</button></div></div>';
}
function setv(k,v){S.cfg[k]=v;save()}
function weakBlock(){
  var o=[];
  KEYS.forEach(function(k){var m=S.wk[k]||{};(k=='abc'?[D.abc0,D.abc1,D.abc2]:[D[k]]).forEach(function(l){l.forEach(function(it){var v=m[iid(it)];if(v)o.push([v,k,it])})})});
  o.sort(function(a,b){return b[0]-a[0]});
  var rows=o.slice(0,12).map(function(x){var it=x[2],t=TABS.filter(function(z){return z[0]==x[1]})[0];return '<span>'+(it.em||it.pic||'')+' '+esc(it.word||it.big||'')+((x[1]=='abc'||x[1]=='hin')&&it.word?' ('+esc(it.big)+')':'')+'</span><span>'+t[2]+'</span>'}).join('');
  return '<div class="srow"><div>🎯 Needs practice (these come back more often)</div><div class="rep">'+rows+'</div>'+(rows?'':'<p class="note">Nothing yet — great!</p>')+'</div>';
}
function voiceRow(){
  var n=Object.keys(RK).length;
  if(!secureOk())return '<div class="srow"><div>🎙️ My recorded voice (optional)</div><div class="warn">'+NOSEC+'</div></div>';
  if(!canRec())return '<div class="srow"><div>🎙️ My recorded voice (optional)</div><p class="note">Recording isn’t available in this browser, so the default voice is used. Open the game in Chrome to record your own voice.</p></div>';
  return '<div class="srow"><div>🎙️ My recorded voice (optional)</div><p class="note">Record your own voice for any letter or word. Anything you don’t record keeps the default voice. Recordings stay on this phone ('+n+' saved).</p><div class="chips"><button class="chip'+(S.cfg.rec?' on':'')+'" onclick="setc(\'rec\',1)">Use my recordings</button><button class="chip'+(S.cfg.rec?'':' on')+'" onclick="setc(\'rec\',0)">Default voice only</button></div><div class="chips"><button class="chip" onclick="voice()">🎙️ Open voice studio</button></div></div>';
}
/* ---------- voice studio (parents) ---------- */
var VK='abc',VL=[];
function allItems(k){return k=='abc'?D.abc0:D[k]}
function slotsOf(k,it){
  var s=[['n',k=='abc'?'Letter':k=='hin'?'Sound':k=='num'?'Number':'Name']];
  if(k=='abc')s.push(['p','“'+it.say+'”']);
  else if(k=='hin'&&it.word)s.push(['p','“'+it.big+' से '+it.word+'”']);
  if(it.hi)s.push(['h','हिन्दी']);
  return s;
}
function recCount(k){return allItems(k).filter(function(it){return RK[rk(k,it,'n')]}).length}
function voice(k){mode='voice';hush();recStop();if(k)VK=k;if(!VM&&!secureOk())VM=NOSEC;micState();renderVoice()}
function renderVoice(){
  var m=$('.main'),st=m?m.scrollTop:0,k=VK;
  VL=allItems(k).map(function(it){return{k:k,it:it}});
  var chips=KEYS.map(function(x){var t=TABS.filter(function(z){return z[0]==x})[0],n=recCount(x);return '<button class="chip sm'+(x==k?' on':'')+'" onclick="voice(\''+x+'\')">'+t[1]+(n?' · '+n:'')+'</button>'}).join('');
  var rows=VL.map(function(v,i){
    var it=v.it,lab=(k=='abc'||k=='hin'||k=='num')?it.big:(it.em||it.pic||''),nm=k=='hin'?(it.word||'—'):(it.word||it.big);
    return '<div class="vrow"><span class="lab">'+lab+'</span><span class="nm">'+esc(nm)+'</span>'+slotsOf(k,it).map(function(s){var key=rk(k,it,s[0]),has=RK[key],on=RC&&RC.key==key;return '<span class="vsl"><small>'+esc(s[1])+'</small><button class="chip sm'+(on?' rec':'')+(has?' has':'')+'" onclick="vrec('+i+',\''+s[0]+'\')" aria-label="Record">'+(on?'⏹':'🎙')+'</button>'+(has?'<button class="chip sm" onclick="vplay('+i+',\''+s[0]+'\')" aria-label="Play">▶</button><button class="chip sm" onclick="vdel('+i+',\''+s[0]+'\')" aria-label="Delete">✕</button>':'')+'</span>'}).join('')+'</div>';
  }).join('');
  frame('set','<h2>🎙️ My voice</h2><p class="note">Tap 🎙, say it, tap ⏹ (it also stops by itself after 5 seconds). Anything you don’t record keeps using the default voice.</p>'+(VM?'<div class="warn">'+esc(VM)+'</div>':(MP=='denied'&&secureOk()?'<div class="warn">'+esc(micWhy({name:'NotAllowedError'}))+'</div>':''))+'<div class="chips">'+chips+'</div>'+rows+'<button class="big" onclick="settings()">Done</button>');
  m=$('.main');if(m)m.scrollTop=st;
}
function vrec(i,slot){
  var v=VL[i];if(!v||RB)return;var key=rk(v.k,v.it,slot);
  if(RC){var same=RC.key==key;recStop();if(same)return}
  recStart(key);
}
function recStart(key){
  if(!secureOk()){VM=NOSEC;renderVoice();return}
  if(!canRec()){VM='Recording is not available in this browser (try Chrome). The default voice will be used.';renderVoice();return}
  hush();RB=1;VM='';
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    var mr,ch=[],rc;
    try{mr=new MediaRecorder(st)}catch(e){st.getTracks().forEach(function(t){t.stop()});RB=0;VM='Recording is not supported here.';renderVoice();return}
    mr.ondataavailable=function(e){if(e.data&&e.data.size)ch.push(e.data)};
    mr.onstop=function(){
      clearTimeout(rc.t);st.getTracks().forEach(function(t){t.stop()});if(RC===rc)RC=null;
      var b=new Blob(ch,{type:mr.mimeType||'audio/webm'});
      if(b.size>800)rput(key,b).then(refreshVoice,function(){VM='Could not save the recording on this phone.';refreshVoice()});
      else{VM='Nothing was recorded. Please try again.';refreshVoice()}
    };
    rc=RC={key:key,mr:mr,t:setTimeout(function(){try{if(mr.state!='inactive')mr.stop()}catch(e){}},5000)};
    RB=0;mr.start();renderVoice();
  }).catch(function(e){RB=0;VM=micWhy(e);renderVoice()});
}
function recStop(){try{if(RC&&RC.mr&&RC.mr.state!='inactive')RC.mr.stop()}catch(e){}}
function refreshVoice(){if(mode=='voice')renderVoice()}
function vplay(i,slot){var v=VL[i];if(!v)return;ac();play([['c',rk(v.k,v.it,slot)]])}
function vdel(i,slot){var v=VL[i];if(!v)return;rdel(rk(v.k,v.it,slot)).then(refreshVoice,refreshVoice)}
function testv(p){ac();if(p=='hi')speak([['hi-IN','क से कबूतर']]);else speak([['en-IN','Hello! Find the letter A']])}
/* ---------- compact parent settings: summary + folding sections ---------- */
var OPEN={},CF='';
var OPTS=[['🔠 Letter case','cs',[['ABC',0],['abc',1],['A→a',2]]],['🇮🇳 Hindi names','hi',[['On',1],['Off',0]]],['🔢 Choices','ch',[['Auto',0],['2',2],['3',3],['4',4]]],['🔊 Sound','snd',[['On',1],['Off',0]]],['🐢 Voice speed','rate',[['Slow',0],['Normal',1],['Fast',2]]],['⏱️ Play time','min',[['Off',0],['10m',10],['15m',15],['20m',20]]],['🎯 Daily goal','goal',[['10⭐',10],['20⭐',20],['30⭐',30]]]];
function det(id,title,body,extra){return '<details class="dt" data-k="'+id+'"'+(OPEN[id]?' open':'')+' ontoggle="OPEN[this.dataset.k]=this.open?1:0"><summary><span class="st">'+title+'</span>'+(extra?'<span class="sx">'+extra+'</span>':'')+'</summary><div class="db">'+body+'</div></details>'}
function seg(key,opts){return '<div class="seg">'+opts.map(function(o){return '<button class="'+(S.cfg[key]===o[1]?'on':'')+'" onclick="setc(\''+key+'\','+o[1]+')">'+o[0]+'</button>'}).join('')+'</div>'}
function settings(){
  mode='set';recStop();
  var off=OFF?'📶 Ready to play without internet':(window.isSecureContext&&location.protocol=='https:'?'':'📴 Opened as a file: voice recording needs the https link');
  var warn=(window.speechSynthesis&&VO.length&&!hasHi())?'<div class="warn">No Hindi voice on this phone, so Hindi is shown but not spoken. Phone Settings → Text-to-speech → Google → Install voice data → Hindi.</div>':'';
  var st=curStreak(),um=Math.floor(used/60);
  var sum='<div class="sum"><div><b>⭐ '+S.stars+'</b><small>stars</small></div><div><b>🏆 '+S.stk+'</b><small>stickers</small></div><div><b>🔥 '+st+'</b><small>day streak</small></div><div><b>⏱️ '+um+(S.cfg.min?'/'+S.cfg.min:'')+'</b><small>min today</small></div></div>';
  var opt='<div class="orow"><span>🧒 Child’s name</span><input class="sel nmi" maxlength="20" value="'+esc(S.cfg.name)+'" placeholder="Name" onchange="setName(this.value)"></div>'+
    OPTS.map(function(r){return '<div class="orow"><span>'+r[0]+'</span>'+seg(r[1],r[2])+'</div>'}).join('');
  var sec=KEYS.map(function(k){var t=tab(k);return '<div class="orow"><span>'+t[1]+' '+t[2]+'</span><select class="sel" onchange="setRange(\''+k+'\',+this.value)">'+
    SETS[k].map(function(s,i){return '<option value="'+i+'"'+(vis(k)&&S.cfg[k]===i?' selected':'')+'>'+esc(s[0])+'</option>'}).join('')+'<option value="-1"'+(vis(k)?'':' selected')+'>🚫 Hidden</option></select></div>'}).join('');
  var rows=KEYS.filter(function(k){return prog(k)[0]>0||(S.sc[k]&&S.sc[k].t)}).map(function(k){var t=tab(k),p=prog(k),r=S.sc[k];return '<span>'+t[1]+' '+t[2]+'</span><span>'+p[0]+'/'+p[1]+'</span><span>'+(r&&r.t?Math.round(r.f/r.t*100)+'%':'–')+'</span>'}).join('');
  var prg=(rows?'<div class="tbl"><span class="th">Game</span><span class="th">Solved</span><span class="th">1st try</span>'+rows+'</div>':'<p class="note">Nothing played yet.</p>')+weakBlock()+
    '<p class="note">Solved words stay saved until the round is finished. A word answered wrongly comes back a few questions later.</p>';
  var rs='<button class="ghost" onclick="rst(\'dn\')">'+(CF=='dn'?'⚠️ Tap again to restart solved progress':'↺ Restart solved progress')+'</button><button class="ghost" onclick="rst(\'all\')">'+(CF=='all'?'⚠️ Tap again to reset stars & accuracy':'↺ Reset stars, accuracy, practice list (stickers stay)')+'</button>';
  frame('set','<h2>Parent settings</h2>'+(off?'<p class="note">'+off+'</p>':'')+warn+sum+
    det('opt','⚙️ Game options',opt)+
    det('sec','📚 Games & word lists',sec,KEYS.filter(vis).length+' / '+KEYS.length+' on')+
    det('prg','📊 Progress',prg)+
    det('voc','🎙️ Voices & recording',voiceRow()+vsel('en','ve','🗣️ English voice')+vsel('hi','vh','🗣️ Hindi voice'))+
    det('rst','🧹 Reset',rs)+
    '<button class="big" onclick="home()">Done</button>');
}
function rst(w){if(CF!=w)CF=w;else{CF='';if(w=='dn')S.dn={};else{S.stars=0;S.sc={};S.wk={};S.ad={};S.td={d:TODAY,n:0}}save()}keepScroll(settings)}
function keepScroll(fn){var m=$('.main'),st=m?m.scrollTop:0;fn();m=$('.main');if(m)m.scrollTop=st}
function setc(k,v){S.cfg[k]=v;if(k=='min')used=0;if(k=='snd'&&!v)hush();save();keepScroll(settings)}
function setName(v){S.cfg.name=String(v||'').replace(/\s+/g,' ').trim().slice(0,20);save()}
function setRange(k,v){if(v<0)S.cfg.hide[k]=1;else{delete S.cfg.hide[k];S.cfg[k]=v}save();keepScroll(settings)}

/* ---------- play-time limit: counts only visible play time per day; survives reload / closing the app ---------- */
setInterval(function(){var t=ymd(new Date());if(t!=TODAY){TODAY=t;used=0}
  if((mode=='play'||mode=='learn'||mode=='pick')&&!document.hidden&&S.cfg.min){used+=5;if(used>=S.cfg.min*60)sleep();else if(used%30==0)save()}},5000);
function sleep(){S.sleep=1;save();mode='sleep';hush();R('<div class="main mid"><div class="bholu">😴</div><h2>Bear is sleeping</h2><p>See you later! 🌙</p><button class="ghost" onclick="gate(wake,sleep)">Parents</button></div>')}
function wake(){S.sleep=0;used=0;save();ac();guard();home()}
document.addEventListener('visibilitychange',function(){if(document.hidden){hush();save()}});
/* belt and braces: flush progress when the app is closed or sent to the background */
window.addEventListener('pagehide',function(){save()});

/* offline: once opened from the https link, the game is saved on the phone and opens without internet */
var OFF=0;
try{if('serviceWorker' in navigator&&window.isSecureContext&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready}).then(function(){OFF=1}).catch(function(){})}}catch(e){}

if(S.sleep)sleep();else splash();
</script>
